<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente de Reposição de Estoque</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1b5e3a 0%, #2f8f5b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
      text-align: center;
    }

    .formulario {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .campo-grupo {
      display: flex;
      flex-direction: column;
    }

    label {
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    label .opcional {
      font-weight: 400;
      color: #999;
    }

    input {
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: #2f8f5b;
      box-shadow: 0 0 0 3px rgba(47, 143, 91, 0.1);
    }

    .botao {
      padding: 12px 24px;
      background-color: #2f8f5b;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 10px;
    }

    .botao:hover {
      background-color: #27774c;
    }

    .botao:active {
      transform: scale(0.98);
    }

    #resultado {
      margin-top: 30px;
      padding: 20px;
      background-color: #f5f5f5;
      border-radius: 6px;
      border-left: 4px solid #2f8f5b;
      min-height: 60px;
      display: none;
    }

    #resultado.ativo {
      display: block;
    }

    .erro {
      border-left-color: #e74c3c !important;
      background-color: #ffe6e6 !important;
    }

    .resultado-cartao {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .resultado-titulo {
      font-size: 22px;
      color: #333;
      margin: 0;
    }

    .selo-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
    }

    .selo-status--alerta {
      background-color: #fff3cd;
      color: #8a6300;
    }

    .selo-status--ok {
      background-color: #d9f0db;
      color: #2e7d32;
    }

    .metricas {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .metrica-card {
      flex: 1;
      min-width: 150px;
      background-color: #ffffff;
      border: 1px solid #e5e5ea;
      border-radius: 8px;
      padding: 14px 16px;
      text-align: center;
    }

    .metrica-valor {
      font-size: 22px;
      font-weight: 700;
      color: #333;
    }

    .metrica-valor.metrica-valor--texto {
      font-size: 15px;
      font-weight: 600;
      color: #2f8f5b;
    }

    .metrica-label {
      font-size: 13px;
      color: #777;
      margin-top: 4px;
    }

    .justificativa {
      font-size: 15px;
      line-height: 1.7;
      color: #333;
      margin: 0;
    }

    .selo-fornecedor {
      font-size: 13px;
      color: #666;
      border-top: 1px solid #e5e5ea;
      padding-top: 12px;
    }

    .selo-fornecedor--aviso {
      color: #a05a00;
    }

    .erro-amigavel {
      margin: 0;
      color: #a12622;
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Agente de Reposição de Estoque</h1>

    <form class="formulario" id="formReposicao">
      <div class="campo-grupo">
        <label for="nomeProduto">Nome do Produto</label>
        <input type="text" id="nomeProduto" name="nomeProduto" required>
      </div>

      <div class="campo-grupo">
        <label for="estoqueAtual">Estoque Atual (unidades)</label>
        <input type="number" id="estoqueAtual" name="estoqueAtual" min="0" required>
      </div>

      <div class="campo-grupo">
        <label for="vendasDiarias">Vendas Médias Diárias (unidades/dia)</label>
        <input type="number" id="vendasDiarias" name="vendasDiarias" min="0" step="0.01" required>
      </div>

      <div class="campo-grupo">
        <label for="leadTime">Lead Time do Fornecedor (dias)</label>
        <input type="number" id="leadTime" name="leadTime" min="0" required>
      </div>

      <div class="campo-grupo">
        <label for="cnpjFornecedor">CNPJ do Fornecedor (14 dígitos)</label>
        <input type="text" id="cnpjFornecedor" name="cnpjFornecedor" placeholder="00000000000000" maxlength="14" pattern="[0-9]{14}" required>
      </div>

      <div class="campo-grupo">
        <label for="estoqueSeguranca">Estoque de Segurança <span class="opcional">(opcional, padrão 0)</span></label>
        <input type="number" id="estoqueSeguranca" name="estoqueSeguranca" min="0" value="0">
      </div>

      <button type="submit" class="botao">Calcular Reposição</button>
    </form>

    <div id="resultado"></div>
  </div>

  <script>
    const formReposicao = document.getElementById('formReposicao');
    const divResultado = document.getElementById('resultado');

    formReposicao.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Coletar valores do formulário
      const dados = {
        nomeProduto: document.getElementById('nomeProduto').value,
        estoqueAtual: Number(document.getElementById('estoqueAtual').value),
        vendasDiarias: Number(document.getElementById('vendasDiarias').value),
        leadTime: Number(document.getElementById('leadTime').value),
        cnpjFornecedor: document.getElementById('cnpjFornecedor').value,
        estoqueSeguranca: Number(document.getElementById('estoqueSeguranca').value)
      };

      const MENSAGEM_ERRO_AMIGAVEL = 'Não foi possível calcular a reposição. Verifique os dados informados e tente novamente.';

      try {
        const resposta = await fetch('/api/reposicao', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(dados)
        });

        if (!resposta.ok) {
          const corpoErro = await resposta.json().catch(() => null);
          console.error('Erro do servidor:', resposta.status, corpoErro);
          throw new Error(MENSAGEM_ERRO_AMIGAVEL);
        }

        const resultado = await resposta.json();
        renderizarResultado(resultado);
      } catch (erro) {
        console.error('Erro:', erro);
        renderizarErro(MENSAGEM_ERRO_AMIGAVEL);
      }
    });

    function escaparHtml(texto) {
      const div = document.createElement('div');
      div.textContent = String(texto);
      return div.innerHTML;
    }

    function renderizarResultado(resultado) {
      const statusClasse = resultado.necessitaReposicao ? 'selo-status--alerta' : 'selo-status--ok';
      const statusTexto = resultado.necessitaReposicao
        ? '⚠ Necessita reposição'
        : '✓ Estoque OK, sem necessidade de reposição';

      const temQuantidadeSugerida = Number(resultado.quantidadeSugerida) > 0;
      const quantidadeTexto = temQuantidadeSugerida
        ? `${resultado.quantidadeSugerida} unidades`
        : 'Nenhuma reposição necessária';
      const quantidadeClasse = temQuantidadeSugerida ? '' : 'metrica-valor--texto';

      let seloFornecedorHtml;
      if (resultado.fornecedor && resultado.fornecedor.sucesso) {
        seloFornecedorHtml = `
          <div class="selo-fornecedor">
            ✓ Fornecedor validado: ${escaparHtml(resultado.fornecedor.razaoSocial)} — situação ${escaparHtml(resultado.fornecedor.situacaoCadastral)}
          </div>`;
      } else {
        const motivo = (resultado.fornecedor && resultado.fornecedor.motivo) || 'motivo não informado';
        seloFornecedorHtml = `
          <div class="selo-fornecedor selo-fornecedor--aviso">
            ⚠ Não foi possível validar o fornecedor: ${escaparHtml(motivo)}
          </div>`;
      }

      divResultado.className = 'ativo';
      divResultado.innerHTML = `
        <div class="resultado-cartao">
          <h2 class="resultado-titulo">${escaparHtml(resultado.nomeProduto)}</h2>
          <span class="selo-status ${statusClasse}">${statusTexto}</span>
          <div class="metricas">
            <div class="metrica-card">
              <div class="metrica-valor">${escaparHtml(resultado.pontoDePedido)} unidades</div>
              <div class="metrica-label">Ponto de Pedido</div>
            </div>
            <div class="metrica-card">
              <div class="metrica-valor ${quantidadeClasse}">${escaparHtml(quantidadeTexto)}</div>
              <div class="metrica-label">Quantidade Sugerida</div>
            </div>
          </div>
          <p class="justificativa">${escaparHtml(resultado.justificativa)}</p>
          ${seloFornecedorHtml}
        </div>
      `;
    }

    function renderizarErro(mensagem) {
      divResultado.className = 'ativo erro';
      divResultado.innerHTML = `<p class="erro-amigavel">${escaparHtml(mensagem)}</p>`;
    }
  </script>
</body>
</html>
